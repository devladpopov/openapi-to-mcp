openapi: 3.1.0
info:
  title: Orders API
  version: 2.1.0
servers:
  - url: https://orders.example.com/v1
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
        - name: starting_after
          in: query
          schema: { type: string }
        - name: status[]
          in: query
          schema:
            type: array
            items: { type: string, enum: [open, shipped] }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  has_more: { type: boolean }
    post:
      operationId: createOrder
      summary: Create an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/OrderInput"
                - type: object
                  properties:
                    note: { type: [string, "null"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /health:
    get:
      operationId: health
      summary: Public health check
      security: []
      responses:
        "200":
          description: OK
webhooks:
  order.created:
    post:
      summary: Sent when an order is created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { const: order.created }
                data: { $ref: "#/components/schemas/Order" }
      responses:
        "200":
          description: Acknowledged
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrderInput:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        metadata:
          type: object
          additionalProperties: { type: string }
    Order:
      allOf:
        - $ref: "#/components/schemas/OrderInput"
        - type: object
          properties:
            id: { type: string, readOnly: true }
            status: { type: string, enum: [open, shipped] }
